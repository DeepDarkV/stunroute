# ============ stunroute 配置 ============
# 全局：
#   dns_server  查询 TXT 用的 DNS 服务器（建议用能直接访问的，如 223.5.5.5 / 8.8.8.8）
#   interval    轮询间隔（秒）
#   dns_alias   1 = 自动把域名注入 NetProxy(sing-box) 的 DNS，解析到下面的回环地址
#   netproxyctl NetProxy 管理命令路径
#
#dns_server=223.5.5.5
#interval=60
#dns_alias=1
#netproxyctl=/data/adb/modules/netproxy/bin/netproxyctl
#
# 服务格式（每行一个，用 | 分隔，共 7 段）：
#   名称|域名|回环地址|端口|协议|TXT记录名|键
#
#   域名      : 应用里访问的域名；留空表示只做 IP 映射（直接用 回环地址:端口 访问）
#   回环地址  : 每个服务用不同的 127.0.0.x，避免同端口冲突
#   端口      : 应用访问用的端口（保持与真实服务一致，这样客户端无感）
#   协议      : tcp / udp
#   TXT记录名 : 发布 ip/port 的 TXT 记录，例如 _stun.example.com
#   键        : 若一条 TXT 里是多服务表（如 "v=1 ssh=1.2.3.4:2222 smb=1.2.3.4:445"），
#               用这个键取对应值；单服务记录可留空
#
# 示例：
#nas-ssh|ssh.example.com|127.0.0.10|22|tcp|_stun.example.com|ssh
#nas-smb|smb.example.com|127.0.0.11|445|tcp|_stun.example.com|smb
